<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品區</title>
    <style>
        /* 基礎全域設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .profile-section {
            width: 100%;
            max-width: 800px;
            background-color: #ffffff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            text-align: center;
        }

        .profile-photo {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background-color: #dfe6e9;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #636e72;
            font-size: 0.95rem;
            border: 3px solid #b2bec3;
        }

        .profile-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .profile-intro {
            font-size: 1rem;
            color: #636e72;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto;
        }

        /* -------------------
           作品區網格容器 (Grid)
        ------------------- */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 1100px;
        }

        /* -------------------
           作品卡片主體樣式
        ------------------- */
        .card {
            width: 100%;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .card-text {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card-btn {
            display: inline-block;
            width: 100%;
            padding: 10px 0;
            text-align: center;
            background-color: #3498db;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .card-btn:hover {
            background-color: #2980b9;
        }

        .contact-section {
            width: 100%;
            max-width: 700px;
            background-color: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .contact-title {
            font-size: 1.4rem;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 600;
            color: #2c3e50;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            font-size: 1rem;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background-color: #2ecc71;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #27ae60;
        }

        .message {
            margin-top: 8px;
            font-weight: 600;
            color: #e74c3c;
        }

        .message.success {
            color: #27ae60;
        }
    </style>
</head>
<body>

    <section class="profile-section">
        <div class="profile-photo">大頭照位置</div>
        <h2 class="profile-name">您的名字</h2>
        <p class="profile-intro">這裡可以填入您的自我介紹，例如您的專長、興趣、作品風格或簡短介紹。</p>
    </section>

    <section class="contact-section">
        <h2 class="contact-title">聯絡我</h2>
        <form class="contact-form" id="contactForm">
            <div class="form-group">
                <label for="name">姓名</label>
                <input type="text" id="name" name="name" placeholder="請輸入您的姓名">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="請輸入您的 Email">
            </div>
            <div class="form-group">
                <label for="message">留言</label>
                <textarea id="message" name="message" placeholder="請輸入您的留言"></textarea>
            </div>
            <button type="submit">送出</button>
            <div class="message" id="formMessage"></div>
        </form>
    </section>

    <!-- 作品區網格容器 -->
    <div class="portfolio-grid">

        <!-- 作品 1 -->
        <div class="card">
            <!-- 替換 src 為您的圖片路徑 -->
            <img class="card-image" src="images/project1.jpg" alt="作品一封面">
            <div class="card-body">
                <h2 class="card-title">我的作品名稱 1</h2>
                <p class="card-text">請在這裡填寫您的第一個作品介紹或簡介，說明這個作品使用了什麼技術或解決了什麼問題。</p>
                <a href="https://your-project-url.com" target="_blank" class="card-btn">查看作品</a>
            </div>
        </div>

        <!-- 作品 2 -->
        <div class="card">
            <!-- 替換 src 為您的圖片路徑 -->
            <img class="card-image" src="images/project2.jpg" alt="作品二封面">
            <div class="card-body">
                <h2 class="card-title">我的作品名稱 2</h2>
                <p class="card-text">請在這裡填寫您的第二個作品介紹或簡介。</p>
                <a href="https://your-project-url.com" target="_blank" class="card-btn">查看作品</a>
            </div>
        </div>

        <!-- 作品 3 -->
        <div class="card">
            <!-- 替換 src 為您的圖片路徑 -->
            <img class="card-image" src="images/project3.jpg" alt="作品三封面">
            <div class="card-body">
                <h2 class="card-title">我的作品名稱 3</h2>
                <p class="card-text">請在這裡填寫您的第三個作品介紹或簡介。</p>
                <a href="https://your-project-url.com" target="_blank" class="card-btn">查看作品</a>
            </div>
        </div>

    </div>

    <script>
        const form = document.getElementById('contactForm');
        const messageBox = document.getElementById('formMessage');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!name || !email || !message) {
                messageBox.textContent = '請填寫完整資訊。';
                messageBox.className = 'message';
                return;
            }

            if (!email.includes('@')) {
                messageBox.textContent = 'Email 必須包含 @ 字元。';
                messageBox.className = 'message';
                return;
            }

            messageBox.textContent = '已送出';
            messageBox.className = 'message success';
            form.reset();
        });
    </script>

</body>
</html>
