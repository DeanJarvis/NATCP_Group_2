<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神秘水晶球占卜</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #1e1b38;
            --primary-color: #a855f7;
            --primary-hover: #9333ea;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --ball-glow: rgba(168, 85, 247, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at center, #2e1065 0%, var(--bg-color) 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #e9d5ff;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        /* 輸入框樣式 */
        .input-group {
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #4c1d95;
            background-color: #110c29;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            text-align: center;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        .input-group input::placeholder {
            color: #6b7280;
        }

        /* 水晶球容器與動畫 */
        .crystal-ball-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .crystal-ball {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(233, 213, 255, 0.8) 0%, rgba(147, 51, 234, 0.6) 40%, rgba(46, 16, 101, 0.9) 100%);
            box-shadow: inset 0 0 25px rgba(255, 255, 255, 0.4), 0 0 30px var(--ball-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        /* 水晶球底座 */
        .ball-stand {
            position: absolute;
            bottom: -15px;
            width: 90px;
            height: 25px;
            background: linear-gradient(to bottom, #4c1d95, #2e1065);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: -1;
        }

        /* 浮動與震動動畫 */
        @keyframes floatBall {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.02); }
        }

        @keyframes shakeBall {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-6px, 4px) rotate(-3deg); }
            40% { transform: translate(6px, -4px) rotate(3deg); }
            60% { transform: translate(-4px, -2px) rotate(-2deg); }
            80% { transform: translate(4px, 2px) rotate(2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .floating {
            animation: floatBall 3s ease-in-out infinite;
        }

        .shaking {
            animation: shakeBall 0.5s ease-in-out;
        }

        /* 水晶球內部的文字 */
        .ball-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            line-height: 1.3;
            z-index: 2;
        }

        /* 按鈕風格 */
        .btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, #7e22ce 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .btn:hover {
            opacity: 0.9;
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: #4b5563;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 歷史紀錄 */
        .history {
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
            text-align: left;
        }

        .history-list {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .history-tag {
            background-color: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #e9d5ff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>神秘水晶球占卜</h1>
        <div class="subtitle">誠心凝視水晶球，輸入心中的疑問</div>

        <div class="input-group">
            <input type="text" id="questionInput" placeholder="例如：我今天的運勢如何？" autocomplete="off">
        </div>

        <div class="crystal-ball-container">
            <div id="crystalBall" class="crystal-ball floating">
                <div id="ballText" class="ball-text">準備就緒</div>
            </div>
            <div class="ball-stand"></div>
        </div>

        <button id="divineBtn" class="btn" onclick="consultOracle()">啟動占卜</button>

        <div class="history">
            <div>近期占卜紀錄：</div>
            <div id="historyList" class="history-list">
                <span style="color: #6b7280;">尚無紀錄</span>
            </div>
        </div>
    </div>

    <script>
        const answers = [
            "毫無疑問，這將會實現",
            "跡象顯示非常正面",
            "可以期待好結果",
            "絕對沒問題",
            "目前情況有些模糊，再等等",
            "問得好，但現在不宜透露",
            "結果可能不如預期，請謹慎",
            "機會渺茫，建議換個方向",
            "答案就在你的心中",
            "短期內充滿變數",
            "順其自然，會看到轉機",
            "切勿急躁，時機尚未成熟"
        ];

        const history = [];

        function consultOracle() {
            const btn = document.getElementById('divineBtn');
            const questionInput = document.getElementById('questionInput');
            const crystalBall = document.getElementById('crystalBall');
            const ballText = document.getElementById('ballText');

            const question = questionInput.value.trim();
            if (!question) {
                ballText.textContent = "請先輸入問題！";
                questionInput.focus();
                return;
            }

            // 停用互動並加入震動動畫
            btn.disabled = true;
            questionInput.disabled = true;
            crystalBall.classList.remove('floating');
            crystalBall.classList.add('shaking');
            ballText.textContent = "凝視中...";

            // 模擬神祕運算延遲 (1.5秒)
            setTimeout(() => {
                // 移除震動，恢復浮動
                crystalBall.classList.remove('shaking');
                crystalBall.classList.add('floating');

                // 隨機抽選解答
                const randomIndex = Math.floor(Math.random() * answers.length);
                const selectedAnswer = answers[randomIndex];

                ballText.textContent = selectedAnswer;

                // 更新歷史紀錄
                updateHistory(question, selectedAnswer);

                // 恢復互動
                btn.disabled = false;
                questionInput.disabled = false;
            }, 1500);
        }

        function updateHistory(question, answer) {
            history.unshift({ question, answer });
            if (history.length > 5) history.pop();

            const historyList = document.getElementById('historyList');
            historyList.innerHTML = history.map(item => 
                `<span class="history-tag" title="問：${item.question}">🔮 ${item.answer}</span>`
            ).join('');
        }
    </script>
</body>
</html>
