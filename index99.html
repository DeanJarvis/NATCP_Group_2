<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上誠心擲茭</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --primary-color: #d97706;
            --primary-hover: #b45309;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #404040;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #fbbf24;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* 輸入框樣式 */
        .input-group {
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #4b5563;
            background-color: #1f2937;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        .input-group input::placeholder {
            color: #6b7280;
        }

        /* 筊杯視覺區塊 */
        .blocks-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 25px;
            height: 110px;
            align-items: center;
            perspective: 600px;
        }

        .block-wrapper {
            width: 55px;
            height: 95px;
            transition: transform 0.5s cubic-bezier(0.4, 2, 0.5, 1);
            transform-style: preserve-3d;
        }

        .bwa-poo {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.4));
        }

        /* 擲茭動畫 */
        @keyframes toss {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            30% { transform: translateY(-90px) rotate(360deg) scale(1.15); }
            60% { transform: translateY(-40px) rotate(720deg) scale(1.05); }
            100% { transform: translateY(0) rotate(1080deg) scale(1); }
        }

        .tossing {
            animation: toss 0.6s ease-in-out;
        }

        /* 結果顯示區 */
        .result-box {
            min-height: 80px;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .result-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* 按鈕風格 */
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4);
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background-color: #4b5563;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 歷史紀錄 */
        .history {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid #404040;
            padding-top: 15px;
            text-align: left;
        }

        .history-list {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .history-tag {
            background-color: #3f3f46;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>線上誠心擲茭</h1>
        <div class="subtitle">請在下方輸入您想請示神明的事情</div>

        <div class="input-group">
            <input type="text" id="questionInput" placeholder="例如：我這週的考試能順利通過嗎？" autocomplete="off">
        </div>

        <div class="blocks-container">
            <div id="wrap1" class="block-wrapper">
                <svg class="bwa-poo" viewBox="0 0 60 100">
                    <defs>
                        <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#b91c1c" />
                            <stop offset="50%" stop-color="#ef4444" />
                            <stop offset="100%" stop-color="#991b1b" />
                        </linearGradient>
                    </defs>
                    <path d="M30,3 C12,3 3,25 3,50 C3,75 12,97 30,97 C30,97 30,3 30,3 Z" fill="url(#wood)" stroke="#7f1d1d" stroke-width="2"/>
                </svg>
            </div>
            <div id="wrap2" class="block-wrapper">
                <svg class="bwa-poo" viewBox="0 0 60 100">
                    <path d="M30,3 C12,3 3,25 3,50 C3,75 12,97 30,97 C30,97 30,3 30,3 Z" fill="url(#wood)" stroke="#7f1d1d" stroke-width="2"/>
                </svg>
            </div>
        </div>

        <div class="result-box">
            <div id="resultTitle" class="result-title">準備好了嗎？</div>
            <div id="resultDesc" class="result-desc">輸入問題後，點擊下方按鈕開始擲茭</div>
        </div>

        <button id="tossBtn" class="btn" onclick="tossBei()">開始擲茭</button>

        <div class="history">
            <div>近期紀錄：</div>
            <div id="historyList" class="history-list">
                <span style="color: #6b7280;">尚無紀錄</span>
            </div>
        </div>
    </div>

    <script>
        const history = [];

        function tossBei() {
            const btn = document.getElementById('tossBtn');
            const questionInput = document.getElementById('questionInput');
            const wrap1 = document.getElementById('wrap1');
            const wrap2 = document.getElementById('wrap2');
            const resultTitle = document.getElementById('resultTitle');
            const resultDesc = document.getElementById('resultDesc');

            const question = questionInput.value.trim();
            if (!question) {
                resultTitle.textContent = "請先輸入問題";
                resultDesc.textContent = "向神明請示前，請先在上方輸入框寫下您的問題喔！";
                questionInput.focus();
                return;
            }

            // 停用按鈕並加入動畫
            btn.disabled = true;
            questionInput.disabled = true;
            wrap1.classList.add('tossing');
            wrap2.classList.add('tossing');
            resultTitle.textContent = "神明正在指示...";
            resultDesc.textContent = `正在為您請示：「${question}」`;

            setTimeout(() => {
                wrap1.classList.remove('tossing');
                wrap2.classList.remove('tossing');

                const rand = Math.random() * 100;
                let outcome = "";

                if (rand < 4) {
                    outcome = "立杯";
                } else if (rand < 27) {
                    outcome = "笑杯";
                } else if (rand < 50) {
                    outcome = "陰杯";
                } else {
                    outcome = "聖杯";
                }

                let titleText = "";
                let descText = "";

                if (outcome === "聖杯") {
                    titleText = "聖杯 (贊同 / 吉)";
                    descText = `針對「${question}」，神明表示同意、可行！`;
                    wrap1.style.transform = "rotate(0deg) scaleX(1)";
                    wrap2.style.transform = "rotate(0deg) scaleX(-1)";
                } else if (outcome === "笑杯") {
                    titleText = "笑杯 (笑而不答)";
                    descText = `針對「${question}」，神明笑而不答，建議重新調整問題再問一次。`;
                    wrap1.style.transform = "rotate(25deg) scaleX(1)";
                    wrap2.style.transform = "rotate(-25deg) scaleX(1)";
                } else if (outcome === "陰杯") {
                    titleText = "陰杯 (否定 / 凶)";
                    descText = `針對「${question}」，神明表示不同意或時機不宜。`;
                    wrap1.style.transform = "rotate(90deg) scaleX(-1)";
                    wrap2.style.transform = "rotate(90deg) scaleX(-1)";
                } else if (outcome === "立杯") {
                    titleText = "立杯 (神蹟顯靈)";
                    descText = `針對「${question}」，竟然擲出立杯！代表神明有極重要的特殊指示。`;
                    wrap1.style.transform = "rotate(90deg) translateY(-25px)";
                    wrap2.style.transform = "rotate(-90deg) translateY(-25px)";
                }

                resultTitle.textContent = titleText;
                resultDesc.textContent = descText;

                updateHistory(outcome, question);
                
                btn.disabled = false;
                questionInput.disabled = false;
            }, 600);
        }

        function updateHistory(outcome, question) {
            history.unshift({ outcome, question });
            if (history.length > 5) history.pop();

            const historyList = document.getElementById('historyList');
            historyList.innerHTML = history.map(item => `<span class="history-tag" title="問題：${item.question}">${item.outcome}</span>`).join('');
        }
    </script>
</body>
</html>
